[package]
name = "libvetro"
description = "Vetro, Silica's native system toolkit: the shared library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vetro_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
serde_json = "1"

[dependencies]
skia-safe.workspace = true
tracing = "0.1"
bitflags = "2"
unicode-segmentation = "1"

[lints]
workspace = true
